version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # requirements.in -> requirements.txt (generated by `uv pip compile`, hash-locked).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per week for minor/patch bumps; majors stay separate for review.
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Hash-locked tooling used by the Security workflow.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    groups:
      ci-tooling:
        patterns: ["*"]
